<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar with coming modules</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f6;--fg:#11302b;--card:#fff;--muted:#587069;--primary:#0b7a68;--psoft:#d5efe8;--accent:#ffc43d;--asoft:#fff1c9;--border:#dce9e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Plus Jakarta Sans","IBM Plex Sans Arabic",sans-serif;padding:24px 16px}
[dir=rtl]{font-family:"IBM Plex Sans Arabic","Plus Jakarta Sans",sans-serif}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 8px;max-width:900px}
h2{font-size:18px;margin:36px 0 4px}.why{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:820px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.side{width:260px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px 12px}
.phone{width:300px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-weight:800;font-size:15px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:16px}
svg{width:20px;height:20px;flex:none}
.it{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:600;color:var(--fg)}
.it.on{background:var(--psoft);color:var(--primary)}
.grp{border:1px solid var(--border);border-radius:16px;margin:6px 0;padding:4px}
.gh{display:flex;align-items:center;gap:10px;padding:7px 8px;font-weight:700;font-size:14px}
.gh .ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#eaf5f1;color:var(--primary)}
.gh .ib.on{background:var(--primary);color:#fff}
.gh .chev{margin-inline-start:auto;color:var(--muted);width:16px;height:16px}
.sub-items{padding-inline-start:14px;border-inline-start:2px solid var(--border);margin-inline-start:22px}
.soon{opacity:.62}
.pill{margin-inline-start:auto;font-size:10.5px;font-weight:700;background:var(--asoft);color:#8a5a00;padding:2px 8px;border-radius:999px}
.lock{width:14px;height:14px;color:var(--muted);margin-inline-start:auto}
.count{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px}
.sep{height:1px;background:var(--border);margin:10px 4px}
.cap{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
[dir=rtl] .cap{letter-spacing:0}
</style></head><body>
<h1>Sidebar with the coming modules — 3 options</h1>
<p class="sub">Coming (locked, not clickable): Students, Academics, Attendance, Exams &amp; grades, Fees, Leave &amp; permissions, Transport, Parent portal. Inventory is dropped. Each option in English and Arabic, desktop width, plus the phone drawer. Icons are the new set.</p>
<div id="out"></div>

ics": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6.5 12 3l9 3.5-9 3.5z\"/><path d=\"M6.5 8v5c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3V8\"/><path d=\"M21 6.5v5\"/></svg>", "fees": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2.5\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M6.5 9.5v5M17.5 9.5v5\"/></svg>", "exams": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2.5\"/><path d=\"M9 4.5V3h6v1.5\"/><path d=\"m9 13 2 2 4-4\"/></svg>", "attendance": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"2.5\"/><path d=\"M3.5 9.5h17M8 3v4M16 3v4\"/><path d=\"m9.5 14.5 1.8 1.8 3.5-3.5\"/></svg>", "leave": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"8\" width=\"17\" height=\"11.5\" rx=\"2.5\"/><path d=\"M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2\"/><path d=\"M3.5 13h17\"/></svg>", "transport": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"3.5\" width=\"15\" height=\"14\" rx=\"3\"/><path d=\"M4.5 11h15M8 17.5V20M16 17.5V20\"/><circle cx=\"8.5\" cy=\"14.3\" r=\".6\"/><circle cx=\"15.5\" cy=\"14.3\" r=\".6\"/></svg>", "parents": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8.5\" cy=\"7.5\" r=\"2.8\"/><circle cx=\"16.5\" cy=\"9\" const it=(L,k,ic,on)=>`<div class="it ${on?'on':''}">${I[ic||k]}${L[k]}</div>`;

const grp=(L,k,ic,inner,on,open=true)=>`<div class="grp"><div class="gh"><span class="ib ${on?'on':''}">${I[ic]}</span>${L[k]}${I.chev.replace('<svg','<svg class="chev"')}</div>${open?`<div class="sub-items">${inner}</div>`:''}</div>`;
const soonGrp=(L,k)=>`<div class="grp soon"><div class="gh"><span class="ib">${I[k]}</span>${L[k]}<span class="pill">${L.soon}</span></div></div>`;
const hr=(L,extra='')=>grp(L,'hr','hrS',it(L,'employees','employees',true)+it(L,'penalties')+it(L,'lateness')+it(L,'payroll')+extra,true);
const acc=(L,extra='')=>grp(L,'acc','acc',it(L,'appr')+it(L,'taxes')+extra);
const adm=L=>grp(L,'admin','admin',it(L,'settings')+it(L,'activity')+it(L,'users')+it(L,'roles'),false,false);
const shell=(L,body,cls='')=>`<div class="side ${cls}"><div class="brand"><span class="logo">◐</span>School ERP Demo</div>${it(L,'dashboard')}${body}<div class="sep"></div>${it(L,'signout')}</div>`;
const SOON=['students','academics','attendance','exams','fees','transport','parents'];
const A=L=>shell(L, hr(L,soonIt(L,'leave'))+acc(L)+SOON.map(k=>soonGrp(L,k)).join('')+adm(L));
const B=L=>shell(L, hr(L)+acc(L)+adm(L)+`<div class="cap">${L.coming}</div>`+[...SOON,'leave'].map(k=>soonIt(L,k)).join(''));
const C=L=>shell(L, `<div class="cap">${L.school}</div>`+grp(L,'students','students',soonIt(L,'students')+soonIt(L,'academics')+soonIt(L,'attendance')+soonIt(L,'exams'),false)+hr(L,soonIt(L,'leave'))+acc(L,soonIt(L,'fees'))+soonGrp(L,'transport')+soonGrp(L,'parents')+adm(L));
const opts=[
 ['A · Locked modules in the list','Each coming module is its own locked row with a "Soon" tag, like Inventory and Students today; Leave & permissions sits inside HR. Simple and familiar, but the sidebar gets long (scrolls on smaller laptops).',A],
 ['B · One "Coming soon" section','A short heading at the bottom with the eight coming modules as small locked rows. Live modules stay on top and uncluttered; the roadmap is visible but out of the way.',B],
 ['C · In place where they belong','A new "School" group (Students, Academics, Attendance, Exams), Leave inside HR, Fees inside Accounting, Transport and Parent portal as locked modules. Shows how the finished product will be organised — the strongest roadmap story for the client.',C],
];
document.getElementById('out').innerHTML=opts.map(([t,w,f])=>`<h2>${t}</h2><p class="why">${w}</p><div class="row"><div><p class="tag">Desktop · English</p>${f(EN)}</div><div dir="rtl"><p class="tag">Desktop · العربية</p>${f(AR)}</div><div dir="rtl"><p class="tag">Phone drawer · العربية</p>${f(AR).replace('class="side ','class="side phone ')}</div></div>`).join('');
</script></body></html>
