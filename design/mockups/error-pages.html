<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error Pages Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
/*
 * Not-found (404) and error pages — three options. Tokens copied from apps/web/src/app/globals.css
 * (direction "Campus"). Light theme only. Option 1 reuses the sign-in illustration
 * (apps/web/src/core/auth/components/sign-in-illustration.tsx), converted to plain SVG below.
 * Every frame carries its own lang/dir, so EN desktop and AR phone sit side by side.
 * All motion runs only under prefers-reduced-motion: no-preference.
 */
:root{
  --radius:14px;
  --background:#f2f8f6; --foreground:#11302b; --card:#ffffff;
  --muted:#f5faf8; --muted-foreground:#587069; --secondary:#eaf4f1;
  --primary:#0b7a68; --primary-foreground:#ffffff; --primary-soft:#d5efe8; --primary-hover:#096656;
  --accent:#ffc43d; --accent-foreground:#4a3400; --accent-soft:#fff1c9;
  --destructive-soft:#fde3df; --destructive-ink:#a82d22;
  --band-2:#bfe6db;
  --border:#dce9e5; --input:#cfe0db;
  --shadow-card:0 1px 2px rgb(11 72 62 / .06),0 10px 30px -12px rgb(11 72 62 / .18);
  --shadow-raised:0 2px 4px rgb(11 72 62 / .05),0 30px 60px -24px rgb(11 72 62 / .28);
  --shadow-primary:0 8px 20px -8px rgb(11 122 104 / .7);
  --bar:#0f2f2a; --bar-ink:#e7f4f0;
  --font-latin:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e4efec;color:var(--foreground);font-family:var(--font-latin);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1980px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
.num{font-family:var(--font-latin);font-variant-numeric:tabular-nums lining-nums}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ph-duotone{line-height:1;display:inline-block}
bdi{unicode-bidi:isolate}
.frame{font-family:var(--font-latin)}
.frame[lang="ar"]{font-family:var(--font-ar)}
.disp{font-family:var(--font-latin);font-weight:800;letter-spacing:-.015em}
[lang="ar"] .disp{font-family:var(--font-ar-display);letter-spacing:0}

/* ---------- mockup chrome ---------- */
.mockbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:80;font-size:13px}
.mockbar strong{font-size:14px}
.mockbar .sp{flex:1}
.seg{display:inline-flex;background:rgb(255 255 255 / .08);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#3a2900}
.opt{padding:28px 24px 40px}
.opt + .opt{border-top:6px solid #d3e4df}
.opt-h{max-width:1900px;margin:0 auto 6px;display:flex;align-items:baseline;gap:14px}
.opt-h h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.opt-h span{color:var(--muted-foreground);font-size:14px}
.opt-note{max-width:1900px;margin:0 auto 10px;color:var(--muted-foreground);font-size:13.5px}
.scr-h{max-width:1900px;margin:22px auto 10px;font-weight:800;font-size:15px;display:flex;gap:10px;align-items:baseline}
.scr-h small{font-weight:500;color:var(--muted-foreground);font-size:13px}
.row{display:flex;gap:30px;align-items:flex-start;justify-content:center}
.fw{display:flex;flex-direction:column;gap:8px}
.cap{font-size:12.5px;color:var(--muted-foreground);font-weight:700}
.desk{width:1440px;height:900px;position:relative;background:var(--background);border-radius:22px;box-shadow:var(--shadow-raised);overflow:hidden;border:1px solid var(--border);display:flex}
.phone{width:410px;height:864px;background:var(--background);border-radius:46px;border:10px solid #1b2e2a;box-shadow:var(--shadow-raised);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone .scroll{overflow-y:auto;flex:1;scrollbar-width:none;display:flex;flex-direction:column}
body[data-show="1"] .opt:not(#opt1),body[data-show="2"] .opt:not(#opt2),body[data-show="3"] .opt:not(#opt3),body[data-show="d"] .opt:not(#optD){display:none}

/* ---------- shell (same as the app: 17rem sidebar ≥1280, phone top bar <768) ---------- */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:22px;position:relative}
.logo::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);inset-block-start:-2px;inset-inline-end:-2px;box-shadow:0 0 0 2px var(--card)}
.brand-name{font-weight:800;font-size:14.5px;line-height:1.25}
[lang="ar"] .brand-name{font-family:var(--font-ar-display)}
.brand-sub{font-size:11.5px;color:var(--muted-foreground)}
.sb{width:272px;flex:none;background:var(--card);border-inline-end:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.sb nav{display:flex;flex-direction:column;gap:6px}
.navlink{display:flex;align-items:center;gap:11px;min-height:38px;padding:7px 10px;border-radius:12px;color:var(--muted-foreground);text-decoration:none;font-weight:600;font-size:13.5px}
.navlink .ph-duotone{font-size:19px}
.navlink[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.single{display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;border-radius:14px;font-weight:700;font-size:14.5px;text-decoration:none}
.mi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--secondary);color:var(--muted-foreground)}
.grp{border-radius:16px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border);padding-bottom:8px}
.grp .gh{display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;font-weight:700;font-size:14.5px}
.grp .kids{display:flex;flex-direction:column;gap:2px;margin-inline-start:34px;border-inline-start:2px solid var(--border);padding-inline:8px}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--muted);border:1px solid var(--border);margin-top:auto;text-decoration:none}
.user .n{font-weight:700;font-size:13px;line-height:1.2}
.user .r{font-size:11.5px;color:var(--muted-foreground)}
.av{border-radius:12px;background:var(--secondary);color:var(--muted-foreground);display:grid;place-items:center;flex:none;width:34px;height:34px;font-size:18px}
.main{flex:1;min-width:0;padding:20px 32px 32px;display:flex;flex-direction:column;gap:14px;position:relative}
.topline{display:flex;align-items:center;gap:10px;min-height:42px;justify-content:flex-end}
.lang{display:inline-flex;background:var(--secondary);border-radius:999px;padding:3px;flex:none}
.lang span{padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px;font-family:var(--font-latin)}
.lang span.on{background:var(--accent);color:var(--accent-foreground)}
.lang .ar{font-family:var(--font-ar-display);font-size:14px}
.bell{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;font-size:21px;flex:none}
.mbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);flex:none}
.mbar .menub{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;font-size:20px;flex:none}
.mbar .brand-name{font-size:14px;flex:1;min-width:0}
.mbar .bell{width:38px;height:38px;font-size:19px;border-radius:12px}
.pbody{padding:18px 16px 24px;display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- shared pieces ---------- */
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius);padding:10px 18px;min-height:44px;font-weight:700;font-size:14px;border:1px solid var(--input);background:var(--card);white-space:nowrap;text-decoration:none}
.btn .ph-duotone{font-size:19px}
.btn-primary{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800;background:var(--accent-soft);color:#6b4b00;width:max-content}
.eyebrow.teal{background:var(--primary-soft);color:var(--primary)}
.ttl{margin:0;line-height:1.15}
.lead{margin:0;color:var(--muted-foreground);text-wrap:pretty}
.ref{display:flex;flex-direction:column;gap:6px}
.ref-box{display:inline-flex;align-items:center;gap:10px;background:var(--muted);border:1px dashed var(--input);border-radius:12px;padding-block:5px;padding-inline:12px 5px;width:max-content;max-width:100%}
.ref-l{font-size:12px;font-weight:700;color:var(--muted-foreground)}
.ref-c{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:13.5px;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate}
.copy{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:5px 10px;font-weight:700;font-size:12.5px;color:var(--primary);min-height:32px}
.copy .ph-duotone{font-size:16px}
.copy.done{color:#126b42;background:#ddf4e7;border-color:transparent}
.ref-h{margin:0;font-size:12.5px;color:var(--muted-foreground)}
.state-note{position:absolute;inset-block-end:14px;inset-inline-end:16px;font-size:11.5px;color:var(--muted-foreground);background:rgb(255 255 255 / .8);padding:4px 10px;border-radius:999px;font-weight:600}

/* ---------- motion (all of it stops under reduced motion) ---------- */
@media (prefers-reduced-motion: no-preference){
  .bob{animation:bob 4s ease-in-out infinite}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
  .steam{animation:steam 3.4s ease-in-out infinite}
  .shim{animation:shim 7s ease-in-out infinite}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
  .paper{transform-box:fill-box;transform-origin:center;animation:paper 5.5s ease-in-out infinite}
  .paper-out{animation:paperOut 9s ease-in-out infinite}
  .wave{animation:wave 1.6s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  .dot3 circle{animation:dot3 1.4s ease-in-out infinite}
  .dot3 circle:nth-child(2){animation-delay:.2s}
  .dot3 circle:nth-child(3){animation-delay:.4s}
  .float{animation:float 6s ease-in-out infinite}
  .orbit{transform-box:view-box;animation:orbit 14s linear infinite}
  .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-9px)}}
@keyframes shim{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes paper{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-6px,-7px) rotate(-8deg)}}
@keyframes paperOut{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,-4px)}}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes dot3{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ================= OPTION 1 · Illustrated (soft 3D) ================= */
.art{display:block;width:100%;height:auto;direction:ltr}
.o1a{display:flex;width:100%;background:var(--card)}
.o1a-panel{position:relative;isolation:isolate;overflow:hidden;width:52%;background:linear-gradient(160deg,var(--secondary),var(--primary-soft));padding:40px;display:flex;flex-direction:column;gap:24px}
.o1a-panel::before{content:"";position:absolute;inset-inline-end:-80px;top:-120px;width:280px;height:280px;border-radius:50%;background:var(--band-2);opacity:.7;z-index:-1}
.o1a-art{margin-block:auto;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card)}
.o1a-side{flex:1;display:flex;flex-direction:column;padding:28px 48px}
.o1a-msg{margin:auto 0;max-width:440px;display:flex;flex-direction:column;gap:14px}
.o1a-msg .ttl{font-size:44px}
.o1a-msg .lead{font-size:16px}
.o1a-msg .acts{margin-top:10px}
.o1-in{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:40px;padding:22px;}
.o1-in .art-wrap{border-radius:18px;overflow:hidden}
.o1-in .txt{display:flex;flex-direction:column;gap:12px;padding-inline-end:24px}
.o1-in .ttl{font-size:32px}
.o1-in .lead{font-size:15px;max-width:400px}
.o1-in .acts{margin-top:8px}
.o1-in .ref{margin-top:14px}
/* phone */
.o1p-panel{background:linear-gradient(160deg,var(--secondary),var(--primary-soft));padding:16px 16px 8px;position:relative;overflow:hidden;isolation:isolate}
.o1p-panel::before{content:"";position:absolute;inset-inline-end:-60px;top:-90px;width:200px;height:200px;border-radius:50%;background:var(--band-2);opacity:.7;z-index:-1}
.o1p-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.o1p-art{margin-top:16px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.o1p-msg{padding:26px 20px 28px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;background:var(--card);flex:1}
.o1p-msg .ttl,.o1pc .ttl{font-size:26px}
.o1p-msg .lead,.o1pc .lead{font-size:14.5px}
.o1p-msg .acts,.o1pc .acts{flex-direction:column;align-self:stretch;margin-top:10px}
.o1pc{padding:12px 12px 22px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.o1pc .art-wrap{border-radius:16px;overflow:hidden;align-self:stretch;margin-bottom:6px}
.o1pc .ref{align-items:center;margin-top:8px}

/* ================= OPTION 2 · Big number, light art ================= */
.o2a{flex:1;display:flex;flex-direction:column;background:
  radial-gradient(600px 400px at 85% 10%,rgb(255 196 61 / .16),transparent 70%),
  radial-gradient(700px 500px at 10% 90%,rgb(11 122 104 / .10),transparent 70%),var(--background)}
.o2a-top{display:flex;align-items:center;justify-content:space-between;padding:26px 40px}
.o2-col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin:auto;padding-bottom:40px}
.o2-col .ttl{font-size:36px}
.o2-col .lead{font-size:16px;max-width:460px}
.o2-col .acts{justify-content:center;margin-top:8px}
.o2-col .ref{align-items:center;margin-top:12px}
.o2-in{flex:1;display:flex}
.o2-in .ttl{font-size:30px}
.o2p .o2-col{padding:8px 4px 20px}
.o2p .o2-col .ttl{font-size:26px}
.o2p .o2-col .lead{font-size:14.5px}
.o2p .o2-col .acts{flex-direction:column;align-self:stretch}

/* ================= OPTION 3 · Card in context ================= */
.o3a{flex:1;display:flex;flex-direction:column}
.o3a-top{display:flex;align-items:center;justify-content:space-between;padding:26px 40px}
.o3a-card{margin:auto;width:460px;padding:36px 36px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;top:-30px}
.o3a-card .ttl{font-size:24px}
.o3a-card .lead{font-size:14.5px}
.o3a-card .acts{margin-top:12px;justify-content:center}
.spot{width:76px;height:76px;flex:none;border-radius:22px;background:linear-gradient(160deg,var(--secondary),var(--primary-soft));display:grid;place-items:center}
.spot svg{width:56px;height:56px}
.o3-in{padding:30px 32px;display:flex;gap:22px;align-items:flex-start;max-width:760px}
.o3-in .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.o3-in .ttl{font-size:21px}
.o3-in .lead{font-size:14.5px}
.o3-in .acts{margin-top:14px}
.o3-in .ref{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.o3p .o3-in{flex-direction:column;padding:24px 20px;gap:14px}
.o3p .o3-in .acts{flex-direction:column;align-self:stretch}
.o3p .o3-in .acts .btn{width:100%}
.o3p .o3-in .txt{align-self:stretch}
.o3p-a{flex:1;display:flex;flex-direction:column;padding:16px}
.o3p-a .o3a-card{width:100%;padding:28px 20px 24px;top:-20px}
.o3p-a .o3a-card .acts{flex-direction:column;align-self:stretch}

/* ================= D · Global error: system fonts only, nothing external ================= */
.gd{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#f2f8f6;color:#11302b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif !important}
.gd *{font-family:inherit !important}
.gd-box{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gd h1{margin:6px 0 0;font-size:26px;line-height:1.2;font-weight:800}
.gd p{margin:0;color:#587069;font-size:15px}
.gd button{margin-top:10px;font:inherit;font-weight:700;font-size:15px;background:#0b7a68;color:#fff;border:0;border-radius:14px;padding:12px 22px;min-height:46px}
.gd small{color:#587069;font-size:12.5px;margin-top:6px}
.gd small b{font-family:ui-monospace,Menlo,monospace !important;direction:ltr;unicode-bidi:isolate;letter-spacing:.04em}
.code-note{max-width:1900px;margin:14px auto 0;background:var(--card);border-radius:16px;padding:14px 18px;font-size:13px;color:var(--muted-foreground);box-shadow:var(--shadow-card)}
.code-note code{font-size:12px;color:var(--foreground)}
</style>
</head>
<body data-show="all">
<div class="mockbar">
  <strong>Not found &amp; error pages — 3 options</strong>
  <div class="seg" id="showSeg" aria-label="Show"><button data-s="all" aria-pressed="true">All</button><button data-s="1">Option 1</button><button data-s="2">Option 2</button><button data-s="3">Option 3</button><button data-s="d">D · Global</button></div>
  <span class="sp"></span><span style="opacity:.75">Each screen: EN desktop 1440 · AR phone 390 · sample names only · motion stops under reduced motion</span>
</div>
<div id="app"></div>

const btnSignin=L=>`<a href="#" class="btn btn-primary">${ic("sign-in","flip")}${tr(L)("signin")}</a>`;
const btnRetry=L=>`<button class="btn btn-primary" type="button">${ic("arrow-clockwise")}${tr(L)("retry")}</button>`;
const refBlock=L=>{const t=tr(L);return `<div class="ref"><div class="ref-box"><span class="ref-l">${t("ref")}</span><span class="ref-c">${REF}</span><button type="button" class="copy" data-copy="${REF}" data-l="${L}">${ic("copy")}<span>${t("copy")}</span></button></div><p class="ref-h">${t("refHelp")}</p></div>`;};
const actsA=(L,signedIn)=>`<div class="acts">${signedIn?btnBack(L):btnSignin(L)}</div>`;
const actsC=L=>`<div class="acts">${btnRetry(L)}${btnBack(L,false)}</div>`;
const note=(txt)=>`<span class="state-note">${txt}</span>`;

/* ================= OPTION 1 ================= */
const O1={
 aD:L=>{const t=tr(L);return deskBare(L,`<div class="o1a"><section class="o1a-panel">${brand(L)}<div class="o1a-art">${scene("nf",L)}</div></section>
   <section class="o1a-side"><div style="display:flex;justify-content:flex-end">${langT(L)}</div>
   <div class="o1a-msg rise"><span class="eyebrow">${t("e404")}</span><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p>${actsA(L,true)}</div></section></div>`);},
 aP:L=>{const t=tr(L);return phoneBare(L,`<div class="o1p-panel"><div class="o1p-top">${brand(L)}${langT(L)}</div><div class="o1p-art">${scene("nf",L,"0 38 400 250")}</div></div>
   <div class="o1p-msg"><span class="eyebrow">${t("e404")}</span><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p>${actsA(L,false)}</div>`);},
 bD:L=>{const t=tr(L);return deskShell(L,"emp",`<div class="card o1-in"><div class="art-wrap">${scene("shelf",L)}</div><div class="txt"><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div>`);},
 bP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody"><div class="card o1pc"><div class="art-wrap">${scene("shelf",L,"0 6 400 250")}</div><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div>`);},
 cD:L=>{const t=tr(L);return deskShell(L,"pay",`<div class="card o1-in"><div class="art-wrap">${scene("err",L)}</div><div class="txt"><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div>`);},
 cP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody"><div class="card o1pc"><div class="art-wrap">${scene("err",L,"0 38 400 250")}</div><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div>`);},
};
/* ================= OPTION 2 ================= */
const O2={
 aD:L=>{const t=tr(L);return deskBare(L,`<div class="o2a"><div class="o2a-top">${brand(L)}${langT(L)}</div><div class="o2-col rise"><div style="width:600px">${big404()}</div><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p>${actsA(L,true)}</div></div>`);},
 aP:L=>{const t=tr(L);return phoneBare(L,`<div class="o2a o2p"><div class="o2a-top" style="padding:16px">${brand(L)}${langT(L)}</div><div class="o2-col"><div style="width:100%;padding:0 6px">${big404()}</div><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p><div class="acts">${btnSignin(L)}</div></div></div>`);},
 bD:L=>{const t=tr(L);return deskShell(L,"emp",`<div class="o2-in"><div class="o2-col"><div style="width:480px">${big404()}</div><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div>`);},
 bP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody o2p"><div class="o2-col"><div style="width:100%">${big404()}</div><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div>`);},
 cD:L=>{const t=tr(L);return deskShell(L,"pay",`<div class="o2-in"><div class="o2-col"><div style="width:380px">${bigWarn()}</div><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div>`);},
 cP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody o2p"><div class="o2-col"><div style="width:86%">${bigWarn()}</div><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div>`);},
};
/* ================= OPTION 3 ================= */
const O3={
 aD:L=>{const t=tr(L);return deskBare(L,`<div class="o3a"><div class="o3a-top">${brand(L)}${langT(L)}</div><div class="card o3a-card rise"><span class="spot">${spotNF()}</span><span class="eyebrow teal" style="margin-top:8px">${t("e404")}</span><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p>${actsA(L,true)}</div></div>`);},
 aP:L=>{const t=tr(L);return phoneBare(L,`<div class="o3a"><div class="o3a-top" style="padding:16px">${brand(L)}${langT(L)}</div><div class="o3p-a"><div class="card o3a-card"><span class="spot">${spotNF()}</span><span class="eyebrow teal" style="margin-top:8px">${t("e404")}</span><h1 class="ttl disp">${t("nfTitle")}</h1><p class="lead">${t("nfBody")}</p><div class="acts">${btnSignin(L)}</div></div></div></div>`);},
 bD:L=>{const t=tr(L);return deskShell(L,"emp",`<div class="card o3-in"><span class="spot">${spotNF()}</span><div class="txt"><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div>`);},
 bP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody o3p"><div class="card o3-in"><span class="spot">${spotNF()}</span><div class="txt"><h1 class="ttl disp">${t("inTitle")}</h1><p class="lead">${t("inBody")}</p><div class="acts">${btnBack(L)}</div></div></div></div>`);},
 cD:L=>{const t=tr(L);return deskShell(L,"pay",`<div class="card o3-in"><span class="spot">${spotErr()}</span><div class="txt"><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div>`);},
 cP:L=>{const t=tr(L);return phoneShell(L,`<div class="pbody o3p"><div class="card o3-in"><span class="spot">${spotErr()}</span><div class="txt"><h1 class="ttl disp">${t("errTitle")}</h1><p class="lead">${t("errBody")}</p>${actsC(L)}${refBlock(L)}</div></div></div>`);},
};
/* ================= D · global error ================= */
const gMark=`<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#fff1c9"/><circle cx="36" cy="36" r="24" fill="#ffc43d"/><rect x="33" y="22" width="6" height="18" rx="3" fill="#4a3400"/><circle cx="36" cy="47.5" r="3.4" fill="#4a3400"/></svg>`;
const gPage=L=>{const t=tr(L);return `<div class="gd"><div class="gd-box">${gMark}<h1>${t("errTitle")}</h1><p>${t("gBody")}</p><button type="button">${t("retry")}</button><small>${t("gCode")}: <b>${REF}</b></small></div></div>`;};

/* ---------- page ---------- */
const SCREENS=[
 ["a","A · Not found, outside the app shell","Wrong URL; the person may be signed out. Desktop shows the signed-in button, phone the signed-out one."],
 ["b","B · Not found inside the shell","Missing record, out of scope, or a page they can't open — one message for all three."],
 ["c","C · Something went wrong, inside the shell","Retry + back, and a reference code to quote to support."],
];
function optSection(id,name,sub,noteTxt,O){
 return `<section class="opt" id="${id}"><div class="opt-h"><h2>${name}</h2><span>${sub}</span></div><p class="opt-note">${noteTxt}</p>
 ${SCREENS.map(([k,h,d])=>`<div class="scr-h">${h}<small>${d}</small></div><div class="row">
  <div class="fw"><span class="cap">EN · desktop 1440${k==="a"?" · signed in":""}</span>${O[k+"D"]("en")}</div>
  <div class="fw"><span class="cap">AR · phone 390${k==="a"?" · signed out":""}</span>${O[k+"P"]("ar")}</div></div>`).join("")}</section>`;
}
function render(){
 document.getElementById("app").innerHTML=
  optSection("opt1","Option 1 · Illustrated (soft 3D)","the sign-in office scene, one story per page","A: the desk is empty and a page drifts out of the window. B: the colleague points at a gap on the shelf. C: the monitor shows a gentle warning and the teacher waves for help. Same art, ids and palette as the sign-in page.",O1)+
  optSection("opt2","Option 2 · Big number, light art","a soft-3D “404” in teal, the 0 a sunflower sun; a calm warning mark for errors","No people; one strong shape, then the message. Lighter to build and to load than option 1.",O2)+
  optSection("opt3","Option 3 · Card in context","the most understated: a clean card with a small spot icon","Inside the shell it reads like any other card on the page, start-aligned; outside it is one centred card.",O3)+
  `<section class="opt" id="optD"><div class="opt-h"><h2>D · Whole-app failure (global error)</h2><span>the same for every option</span></div>
   <p class="opt-note">No shell, no web fonts, no icon font, no images: system fonts, one inline SVG and inline styles, so it renders even when the app's CSS or fonts fail. One button reloads.</p>
   <div class="row"><div class="fw"><span class="cap">EN · desktop 1440</span>${deskBare("en",gPage("en"))}</div><div class="fw"><span class="cap">AR · phone 390</span>${phoneBare("ar",gPage("ar"))}</div></div>
   <div class="code-note">Language: <code>global-error.tsx</code> replaces the root layout, so it reads the locale from the URL's first segment (<code>/ar/…</code>) and sets <code>&lt;html lang dir&gt;</code> itself; both strings live inline in the file, not in the message files. The code is Next's error <code>digest</code>, shortened.</div></section>`;
}
render();
document.addEventListener("click",e=>{
 const b=e.target.closest(".copy");
 if(b){const L=b.dataset.l;try{navigator.clipboard?.writeText(b.dataset.copy)}catch{};b.classList.add("done");b.innerHTML=`${ic("check")}<span>${tr(L)("copied")}</span>`;setTimeout(()=>{b.classList.remove("done");b.innerHTML=`${ic("copy")}<span>${tr(L)("copy")}</span>`},1800);}
 const s=e.target.closest("[data-s]");
 if(s){document.body.dataset.show=s.dataset.s;document.querySelectorAll("#showSeg button").forEach(x=>x.setAttribute("aria-pressed",x===s));}
});
</script>
</body>
</html>
