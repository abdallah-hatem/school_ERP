<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
/* Tokens copied from apps/web/src/app/globals.css (direction "Campus"). Light theme only. */
:root{
  --radius:14px;
  --background:#f2f8f6; --foreground:#11302b; --card:#ffffff;
  --muted:#f5faf8; --muted-foreground:#587069; --secondary:#eaf4f1;
  --primary:#0b7a68; --primary-foreground:#ffffff; --primary-soft:#d5efe8; --primary-hover:#096656;
  --accent:#ffc43d; --accent-foreground:#4a3400; --accent-soft:#fff1c9;
  --success:#1f9a62; --success-soft:#ddf4e7; --success-ink:#126b42;
  --warning:#d9771c; --warning-soft:#ffe8d2; --warning-ink:#8f4608;
  --destructive:#d9473a; --destructive-soft:#fde3df; --destructive-ink:#a82d22;
  --info:#2f6fb3; --info-soft:#e0eefb; --info-ink:#24578e;
  --border:#dce9e5; --input:#cfe0db;
  --overlay:rgb(9 40 35 / .42);
  --shadow-card:0 1px 2px rgb(11 72 62 / .06),0 10px 30px -12px rgb(11 72 62 / .18);
  --shadow-raised:0 2px 4px rgb(11 72 62 / .05),0 30px 60px -24px rgb(11 72 62 / .28);
  --shadow-primary:0 8px 20px -8px rgb(11 122 104 / .7);
  --ease-snappy:cubic-bezier(.22,1,.36,1);
  --bar:#0f2f2a; --bar-ink:#e7f4f0;
  --font-latin:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font:var(--font-latin); --font-display:var(--font-latin);
  color-scheme:light;
}
:root[lang="ar"]{--font:var(--font-ar);--font-display:var(--font-ar-display)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e4efec;color:var(--foreground);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
.num{font-family:var(--font-latin);font-variant-numeric:tabular-nums lining-nums}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ph-duotone.flip,.ph-duotone.car{display:inline-block}
.ph-duotone{line-height:1}
bdi{unicode-bidi:isolate}

/* ---------- mockup bar ---------- */
.mockbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:50;flex-wrap:wrap;font-size:13px}
.mockbar strong{font-size:14px}
.mockbar .hint{opacity:.7}
.mockbar .sp{flex:1}
.seg{display:inline-flex;background:rgb(255 255 255 / .08);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#3a2900}
.seg .ar{font-family:var(--font-ar-display);font-size:15px}
.optnote{padding:18px 24px 0;max-width:1488px;margin-inline:auto;color:var(--muted-foreground);font-size:13.5px}
.optnote b{color:var(--foreground)}
.section-title{max-width:1488px;margin:28px auto 10px;padding-inline:24px;font-family:var(--font-display);font-weight:800;font-size:16px}
body.only-desktop #phoneSec, body.only-phone #deskSec{display:none}

/* ---------- frames ---------- */
.desk-scroll{overflow-x:auto;padding:6px 24px 8px}
.desk{width:1440px;margin-inline:auto;position:relative;background:var(--background);border-radius:22px;box-shadow:var(--shadow-raised);overflow:hidden;border:1px solid var(--border);display:flex;min-height:1000px;container:page / inline-size}
.phones{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;padding:6px 24px 60px;align-items:flex-start}
.phone-wrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.phone-cap{font-size:12.5px;color:var(--muted-foreground);font-weight:600}
.phone{width:390px;height:844px;background:var(--background);border-radius:44px;border:10px solid #1b2e2a;box-shadow:var(--shadow-raised);overflow:hidden;position:relative;container:page / inline-size;display:flex;flex-direction:column}
.phone .scroll{overflow-y:auto;flex:1;scrollbar-width:none}
body.full .phone:not(.fixed){height:auto;min-height:844px}
body.full .phone:not(.fixed) .scroll{overflow:visible}

/* ---------- sidebar (app shell, option B module groups) ---------- */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:22px;position:relative}
.logo::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);inset-block-start:-2px;inset-inline-end:-2px;box-shadow:0 0 0 2px var(--card)}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:14.5px;line-height:1.25}
.brand-sub{font-size:11.5px;color:var(--muted-foreground)}
.soon{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--secondary);color:var(--muted-foreground);margin-inline-start:auto;white-space:nowrap}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--muted);border:1px solid var(--border)}
.user .av{width:36px;height:36px;border-radius:12px;font-size:13px}
.user .n{font-weight:700;font-size:13px;line-height:1.2}
.user .r{font-size:11.5px;color:var(--muted-foreground)}
.user > .ph-duotone{margin-inline-start:auto;color:var(--muted-foreground);font-size:18px}
.navlink{display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 12px;border-radius:12px;color:var(--muted-foreground);text-decoration:none;font-weight:600;font-size:14px}
.navlink .ph-duotone{font-size:20px}
.navlink[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.navlink[aria-current="page"]::after{content:"";margin-inline-start:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.sb{width:272px;flex:none;background:var(--card);border-inline-end:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.sb nav{display:flex;flex-direction:column;gap:6px}
.mod{border-radius:16px}
.mod[open]{background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.mod summary{list-style:none;display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--foreground)}
.mod summary::-webkit-details-marker{display:none}
.mi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.mod summary .car{margin-inline-start:auto;color:var(--muted-foreground);font-size:16px}
.mod[open] summary .car{transform:rotate(180deg)}
.mod .kids{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px;margin-inline-start:24px;border-inline-start:2px solid var(--border);padding-inline-start:8px}
.mod .kids .navlink{min-height:36px;font-size:13.5px;padding:6px 10px}
.mod.dis summary{cursor:not-allowed;color:var(--muted-foreground);font-weight:600}
.mod.dis summary .mi{filter:grayscale(1);opacity:.7}
.sb .single{display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--foreground);text-decoration:none}
.sb .single .mi{background:var(--secondary);color:var(--muted-foreground)}
.sb .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.newdot{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:#6b4b00;margin-inline-start:auto}

/* ---------- main + common controls ---------- */
.main{flex:1;min-width:0;padding:22px 36px 36px;display:flex;flex-direction:column;gap:18px;position:relative}
.topline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-foreground);min-height:40px}
.topline .sp{flex:1}
.lang{display:inline-flex;background:var(--secondary);border-radius:999px;padding:3px}
.lang span{padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.lang span.on{background:var(--accent);color:var(--accent-foreground)}
.lang .ar{font-family:var(--font-ar-display);font-size:14px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
:root[lang="ar"] .head h1{letter-spacing:0}
.head p{margin:4px 0 0;color:var(--muted-foreground);font-size:14px;max-width:640px}
.head .acts{margin-inline-start:auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--input);background:var(--card);white-space:nowrap}
.btn .ph-duotone{font-size:18px}
.btn-primary{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--primary)}
.toolbar{background:var(--card);border-radius:20px;box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:2.2;min-width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;height:42px;background:var(--card);color:var(--muted-foreground)}
.search .ph-duotone{font-size:18px;flex:none}
.search span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsel{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;background:var(--card);font-size:13.5px;font-weight:600;color:var(--foreground);white-space:nowrap;position:relative}
.fsel .ph-duotone{color:var(--muted-foreground);font-size:16px}
.fsel .ph-caret-down{margin-inline-start:auto}
.fsel.set{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.fsel.set .ph-duotone{color:var(--primary)}
.resline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground);padding:0 4px;flex-wrap:wrap}
.resline b{color:var(--foreground)}
.resline .sp{flex:1}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 8px 3px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:13px;padding:0;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-card)}
.av{border-radius:12px;background:var(--accent);color:var(--accent-foreground);display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--font-display);width:34px;height:34px;font-size:12.5px}
.av.anon{background:var(--secondary);color:var(--muted-foreground)}
.av.sm{width:28px;height:28px;border-radius:10px;font-size:11px}
.av.lg{width:42px;height:42px;border-radius:14px;font-size:14px}
.ibtn{width:34px;height:34px;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.ibtn .ph-duotone{font-size:18px}
.ibtn.on{background:var(--primary-soft);color:var(--primary)}
.ibtn.bd{border-color:var(--border);background:var(--card)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .n{font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .r{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ph-duotone{font-size:14px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.m-core{background:var(--secondary);color:var(--muted-foreground)}
.m-hr{background:var(--primary-soft);color:var(--primary)}
.t-money{background:var(--info-soft);color:var(--info-ink)}
.t-fail{background:var(--warning-soft);color:var(--warning-ink)}
.p-active{background:var(--success-soft);color:var(--success-ink)}
.kic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--secondary);color:var(--muted-foreground)}
.kic.money{background:var(--info-soft);color:var(--info)}
.kic.fail{background:var(--warning-soft);color:var(--warning)}
.kic.ok{background:var(--success-soft);color:var(--success)}
.sent{line-height:1.45}
.sent .rec{font-weight:700}
.chg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;vertical-align:baseline}
.old{color:var(--muted-foreground);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted-foreground) 60%,transparent)}
.new{font-weight:700}
.arr{font-size:13px;color:var(--muted-foreground)}
.money{font-weight:700;white-space:nowrap}
.money .cur{font-weight:600;color:var(--muted-foreground);font-size:.82em}
.new .money,.money.new{color:var(--info-ink)}
.time{white-space:nowrap;color:var(--foreground);font-weight:600;font-size:13px;border-bottom:1px dashed var(--input);cursor:help;position:relative}
.time-sub{font-size:12px;color:var(--muted-foreground)}
.tip{position:absolute;inset-block-start:calc(100% + 8px);inset-inline-start:-6px;background:var(--foreground);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:5;box-shadow:var(--shadow-raised)}
.tip::before{content:"";position:absolute;top:-4px;inset-inline-start:16px;width:8px;height:8px;background:inherit;transform:rotate(45deg)}

/* changes table (shared) */
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{font-size:12px;color:var(--muted-foreground);font-weight:600;text-align:start;padding:6px 12px;border-bottom:1px solid var(--border)}
.ctab td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.ctab tr:last-child td{border-bottom:0}
.ctab td.f{color:var(--muted-foreground);font-weight:600;width:30%}
.ctab td.b{color:var(--muted-foreground)}
.ctab td.a{font-weight:700}
.ctab .none{color:var(--muted-foreground);font-weight:500}
.ctab .arcell{width:24px;color:var(--muted-foreground);padding-inline:0;text-align:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{background:var(--muted);border-radius:12px;padding:8px 12px;min-width:0}
.fact .l{font-size:11.5px;color:var(--muted-foreground)}
.fact .v{font-size:13px;font-weight:700;overflow-wrap:anywhere}

/* row menu */
.menu{position:absolute;z-index:6;background:var(--card);border-radius:14px;box-shadow:var(--shadow-raised);border:1px solid var(--border);padding:6px;min-width:230px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--foreground);text-decoration:none;white-space:nowrap}
.menu a .ph-duotone{font-size:18px;color:var(--muted-foreground)}
.menu a.hl{background:var(--muted)}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;border-top:1px solid var(--border)}
.pager .info{font-size:13px;color:var(--muted-foreground)}
.pages{display:flex;gap:6px;align-items:center}
.pg{min-width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 8px}
.pg[aria-current="page"]{background:var(--primary);color:#fff;border-color:transparent}
.pg[disabled]{opacity:.45;cursor:default}
.pg .ph-duotone{font-size:16px}
.gap{color:var(--muted-foreground)}
.mpager{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.mpager .info{font-size:12.5px;color:var(--muted-foreground)}
.mpager .row{display:flex;align-items:center;justify-content:space-between}
.mpager .row b{font-size:13px}

/* tabs (profile) */
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted-foreground)}
.crumb .ph-duotone{font-size:12px}
.submeta{font-size:14px;color:var(--muted-foreground);margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 16px;font-weight:600;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.tab.on{color:var(--primary);border-color:var(--primary);font-weight:700}
.tab .cnt{font-size:11px;font-weight:800;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:0 7px}
.sec-h{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:800}
.sec-h p{margin:2px 0 0;font-size:13px;color:var(--muted-foreground)}
.sec-h .sp{flex:1}
/* ---------- phone chrome ---------- */
.mbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);flex:none}
.mbar .menub{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;font-size:20px}
.mbar .brand-name{font-size:14px}
.mbar .lang{margin-inline-start:auto}

/* skeleton */
.sk{background:var(--secondary);border-radius:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.skrow{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.skrow .l1{display:flex;gap:10px;align-items:center}

/* picker sheet */
.scrim{position:absolute;inset:0;background:var(--overlay);z-index:5}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-raised);display:flex;flex-direction:column;max-height:88%}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--input);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--border)}
.sheet .sh h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:800;flex:1;min-width:0}
.sheet .sbody{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.plist{display:flex;flex-direction:column;gap:2px}
.popt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
.popt.sel{background:var(--primary-soft)}
.popt .who{flex:1}
.popt .ck{color:var(--primary);font-size:18px}
.popt .ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--secondary);color:var(--muted-foreground);font-size:16px;flex:none}
.pinput{display:flex;align-items:center;gap:8px;border:1px solid var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);border-radius:var(--radius);padding:0 12px;height:42px;color:var(--muted-foreground);font-size:13.5px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 24px}
.empty .eic{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:32px;margin-bottom:6px}
.empty h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:800}
.empty p{margin:0;color:var(--muted-foreground);font-size:13.5px}
.ta{width:calc(100% - 20px);margin:10px;border-collapse:separate;border-spacing:0}
.ta>thead th{background:var(--muted);font-size:12.5px;color:var(--muted-foreground);font-weight:600;text-align:start;padding:11px 14px;white-space:nowrap}
.ta>thead th:first-child{border-start-start-radius:12px;border-end-start-radius:12px}
.ta>thead th:last-child{border-start-end-radius:12px;border-end-end-radius:12px}
.ta>tbody>tr>td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;position:relative}
.segm{display:flex;background:var(--secondary);border-radius:12px;padding:3px}
.segm span{flex:1;text-align:center;padding:6px 8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted-foreground);white-space:nowrap}
.segm span.on{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgb(11 72 62 / .12)}

/* ================= ACCESS (users, roles, my account) ================= */
.desk{min-height:0}
.desk .main{min-height:900px}
a.lnk{color:var(--primary);font-weight:700;text-decoration:none}
a.lnk:hover{text-decoration:underline}
.muted{color:var(--muted-foreground)}
.sm{font-size:12.5px}
.who a.n{color:var(--foreground);text-decoration:none}
.who a.n:hover{color:var(--primary);text-decoration:underline}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn[disabled]{opacity:.5;box-shadow:none;cursor:not-allowed}
.btn-danger{color:var(--destructive-ink);border-color:color-mix(in srgb,var(--destructive) 35%,var(--input))}
.btn-block{width:100%}
.addb .plus{width:22px;height:22px;border-radius:8px;background:rgb(255 255 255 / .22);display:grid;place-items:center}
.addb .plus .ph-duotone{font-size:14px}
.btn:not(.btn-primary).addb .plus{background:var(--primary-soft);color:var(--primary)}

.desk .ta>tbody>tr>td{padding:12px 10px}.desk .ta>thead th{padding:11px 10px}
.toolbar>.search{flex:none;min-height:42px}
.toast.side{inset-inline-end:564px}
.bigtabs span.on .cnt{background:rgb(255 255 255 / .25);color:#fff}
.cwrap{grid-template-columns:210px minmax(0,1fr)!important}
.cwrap .ta td:first-child .who{max-width:220px}
.cwrap .ta td:nth-child(2){max-width:190px}
.cwrap .ta>tbody>tr>td,.cwrap .ta>thead th{padding-inline:8px}
/* chips */
.rchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--primary-soft);color:var(--primary)}
.rchip .ph-duotone{font-size:13px}
.rchip.sa{background:var(--accent-soft);color:#6b4b00}
.rchip.cu{background:var(--info-soft);color:var(--info-ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bi{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--secondary);color:var(--muted-foreground);white-space:nowrap;font-family:var(--font)}
.bi .ph-duotone{font-size:12px}
.bi.cu{background:var(--info-soft);color:var(--info-ink)}
.p-inactive{background:var(--secondary);color:var(--muted-foreground)}
.p-temp{background:var(--warning-soft);color:var(--warning-ink)}
.emp{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;text-decoration:none;font-size:13px;white-space:nowrap}
.emp .ph-duotone{font-size:16px}
.none{color:var(--muted-foreground)}
.avs{display:flex;align-items:center}
.avs .av{box-shadow:0 0 0 2px var(--card)}
.avs .av + .av{margin-inline-start:-8px}
.avs .more{margin-inline-start:6px;font-size:12px;font-weight:700;color:var(--muted-foreground)}
tr.inact td .who .n,tr.inact td .ell{color:var(--muted-foreground)}
tr.inact .av{filter:grayscale(1);opacity:.6}

/* forms */
.fcard{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.fcard h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.fcard .fsub{margin:-10px 0 0;font-size:13px;color:var(--muted-foreground)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lb{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.field>.lb .opt{font-weight:500;color:var(--muted-foreground)}
.input{min-height:42px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--card);font-size:14px;min-width:0}
.input .ph-duotone{font-size:18px;color:var(--muted-foreground);flex:none}
.input .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.input.ph{color:var(--muted-foreground)}
.input.ro{background:var(--muted);color:var(--muted-foreground)}
.input.focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.input.err{border-color:var(--destructive);box-shadow:0 0 0 3px color-mix(in srgb,var(--destructive) 14%,transparent)}
.input .dots{letter-spacing:2px;font-weight:800}
.fh{font-size:12.5px;color:var(--muted-foreground)}
.fe{font-size:12.5px;color:var(--destructive-ink);display:flex;align-items:center;gap:6px;font-weight:600}
.fe .ph-duotone{font-size:15px}
.sepline{height:1px;background:var(--border);margin:2px 0}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--input);display:grid;place-items:center;flex:none;background:var(--card);color:transparent}
.cbx .ph-duotone{font-size:13px}
.cbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cbx.lock{background:color-mix(in srgb,var(--primary) 40%,#fff);border-color:transparent;color:#fff}
.cklist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ckrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--border);min-width:0}
.ckrow.on{background:color-mix(in srgb,var(--primary-soft) 60%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.ckrow.lock{background:var(--muted);border-style:dashed;border-color:var(--input)}
.ckrow .t{font-weight:700;font-size:13.5px;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ckrow .d{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.ckrow .why{font-size:12px;color:var(--warning-ink);margin-top:4px;display:flex;gap:5px;align-items:flex-start;font-weight:600}
.ckrow .why .ph-duotone{font-size:14px;margin-top:1px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13px;align-items:flex-start}
.note>.ph-duotone{font-size:20px;flex:none}
.note b{font-weight:800}
.note .nb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.note.warn{background:var(--warning-soft);color:var(--warning-ink)}
.note.info{background:var(--info-soft);color:var(--info-ink)}
.note.err{background:var(--destructive-soft);color:var(--destructive-ink)}
.note.ok{background:var(--success-soft);color:var(--success-ink)}
.note.lock{background:var(--muted);color:var(--muted-foreground);border:1px dashed var(--input)}
.note.lock b{color:var(--foreground)}
.copy{display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed color-mix(in srgb,var(--warning) 50%,transparent);border-radius:12px;padding:8px 12px}
.copy .code{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--foreground);flex:1;direction:ltr;text-align:start}
.dd{position:absolute;z-index:8;inset-inline:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-raised);padding:6px;display:flex;flex-direction:column;gap:2px}
.dd .pinput{margin:2px 2px 6px}
.dd .popt{padding:7px 10px}
.dd .foot{font-size:12px;color:var(--muted-foreground);padding:6px 10px 4px;border-top:1px solid var(--border);margin-top:4px}
.popt .code{font-size:12px;color:var(--muted-foreground);font-weight:600}
.popt.dis{opacity:.55}
.rel{position:relative}
.sticky{position:sticky;bottom:12px;background:var(--card);box-shadow:var(--shadow-raised);border:1px solid var(--border);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:3;flex-wrap:wrap}
.sticky .st{font-size:13px;color:var(--muted-foreground);flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sticky .st .ph-duotone{font-size:17px}
.sticky .st.chg{color:var(--warning-ink);font-weight:700}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.side-col{display:flex;flex-direction:column;gap:18px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .l{font-size:12px;color:var(--muted-foreground)}
.kv .v{font-weight:700}

/* toast */
.toast{position:absolute;top:18px;inset-inline-end:24px;z-index:30;background:var(--card);border-radius:16px;box-shadow:var(--shadow-raised);border:1px solid var(--border);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;width:380px;max-width:calc(100% - 24px)}
.toast .tic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--success-soft);color:var(--success)}
.toast.err .tic{background:var(--destructive-soft);color:var(--destructive)}
.toast .tt{font-weight:800;font-size:13.5px}
.toast .tb{font-size:12.5px;color:var(--muted-foreground)}
.toast .x{margin-inline-start:auto;color:var(--muted-foreground);font-size:16px}
.toast.err{border-color:color-mix(in srgb,var(--destructive) 30%,var(--border))}

/* switch + scope */
.sw{width:38px;height:22px;border-radius:999px;background:var(--input);position:relative;flex:none;display:inline-block}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.sw.on{background:var(--primary)}
.sw.on::after{inset-inline-start:19px}
.sw.ro{opacity:.55}
.scp{display:inline-flex;background:var(--secondary);border-radius:11px;padding:3px;gap:2px;flex:none}
.scp span{padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted-foreground);white-space:nowrap}
.scp span.on{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgb(11 72 62 / .14)}
.scp.off{opacity:.4}
.scsel{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--input);border-radius:11px;font-size:12.5px;font-weight:700;background:var(--card);white-space:nowrap}
.scsel .ph-duotone{font-size:15px;color:var(--muted-foreground)}
.scsel.w{border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-soft);color:var(--info-ink)}
.scsel.w .ph-duotone{color:var(--info-ink)}
.nosc{font-size:12px;color:var(--muted-foreground);white-space:nowrap}

/* permission list */
.pmod{display:flex;align-items:center;gap:12px;padding:18px 22px 10px;flex-wrap:wrap}
.pmod h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:800}
.pmod .cnt{font-size:12.5px;color:var(--muted-foreground);font-weight:600}
.pmod .sp{flex:1}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 22px;border-top:1px solid var(--border)}
.prow .pl{font-weight:700;font-size:13.5px;line-height:1.3}
.prow .pdsc{font-size:12.5px;color:var(--muted-foreground);line-height:1.4}
.prow .pk{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted-foreground);direction:ltr;unicode-bidi:isolate}
.prow.off .pl{color:var(--muted-foreground);font-weight:600}
.prow.chg{background:color-mix(in srgb,var(--warning-soft) 55%,transparent)}
.prow.sub{border-top-style:dashed}

/* drawers, dialogs */
.dim{position:absolute;inset:0;background:var(--overlay);z-index:9}
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:540px;background:var(--card);box-shadow:var(--shadow-raised);z-index:10;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.drawer .dh h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1.25}
.drawer .db{flex:1;overflow:hidden;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.drawer .df{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--card)}
.drawer .df .st{flex:1;font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec>.h{font-size:12px;font-weight:800;color:var(--muted-foreground);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
:root[lang="ar"] .dsec>.h{letter-spacing:0;font-size:13px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--input);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--card)}
.tchip .ph-duotone{font-size:15px}
.tchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tchip.lock{background:var(--accent-soft);border-color:transparent;color:#6b4b00}
.dlg{position:absolute;z-index:10;inset-inline-start:50%;top:70px;transform:translateX(-50%);width:640px;background:var(--card);border-radius:24px;box-shadow:var(--shadow-raised);display:flex;flex-direction:column}
[dir="rtl"] .dlg{transform:translateX(50%)}
.dlg .dh{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 14px}
.dlg .dh h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:800}
.dlg .db{padding:4px 24px 18px;display:flex;flex-direction:column;gap:16px}
.dlg .df{padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dlg .df .st{flex:1;font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.ms{min-height:44px;border:1px solid var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);border-radius:var(--radius);padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ms .tok{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ms .tok.lock{background:var(--accent-soft);color:#6b4b00;padding-inline-end:10px}
.ms .tok .ph-duotone{font-size:13px}
.ms .typ{color:var(--muted-foreground);font-size:13.5px;padding:0 4px}
.lockreason{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--warning-ink);font-weight:600}
.lockreason .ph-duotone{font-size:15px;margin-top:1px}

/* users option B cards */
.ugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ucard{background:var(--card);border-radius:20px;box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.ucard .top{display:flex;gap:12px;align-items:flex-start}
.ucard .top .who{flex:1}
.ucard .ufoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px;font-size:12.5px;color:var(--muted-foreground)}
.ucard .ufoot .sp{flex:1}
.ucard.inact{background:var(--muted);box-shadow:none;border:1px dashed var(--input)}
.ucard.inact .av{filter:grayscale(1);opacity:.6}
.ucard.sel{box-shadow:0 0 0 2px var(--primary),var(--shadow-card)}
.ucard.add{border:2px dashed var(--input);background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--primary);font-weight:700;min-height:150px}
.ucard.add .plus{width:40px;height:40px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;font-size:22px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow-card);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rcard .rt{display:flex;align-items:flex-start;gap:12px}
.rcard .ricon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--primary-soft);color:var(--primary)}
.rcard .ricon.sa{background:var(--accent-soft);color:#6b4b00}
.rcard .ricon.cu{background:var(--info-soft);color:var(--info-ink)}
.rcard h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:800;line-height:1.3}
.rcard .bar{height:6px;border-radius:6px;background:var(--secondary);overflow:hidden}
.rcard .bar i{display:block;height:100%;background:var(--primary);border-radius:6px}
.rcard .rf{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted-foreground)}
.rcard .rf .sp{flex:1}
.rcard.sel{box-shadow:0 0 0 2px var(--primary),var(--shadow-card)}
.grp-h{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:16px;margin-top:6px}
.grp-h .c{font-family:var(--font);font-weight:600;font-size:12.5px;color:var(--muted-foreground)}

/* option C */
.cwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.rail{padding:12px;display:flex;flex-direction:column;gap:2px}
.rail .rh{font-size:12px;font-weight:800;color:var(--muted-foreground);padding:8px 10px 4px}
.rail a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;color:var(--foreground);text-decoration:none;font-size:13.5px;font-weight:600}
.rail a .c{margin-inline-start:auto;font-size:12px;color:var(--muted-foreground);font-weight:700}
.rail a.on{background:var(--primary-soft);color:var(--primary);font-weight:800}
.rail a.on .c{color:var(--primary)}
.rail .dotc{width:8px;height:8px;border-radius:50%;flex:none}
.bigtabs{display:flex;gap:4px;background:var(--card);border-radius:16px;padding:5px;box-shadow:var(--shadow-card);width:max-content;max-width:100%}
.bigtabs span{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;font-weight:700;color:var(--muted-foreground);white-space:nowrap}
.bigtabs span .ph-duotone{font-size:18px}
.bigtabs span.on{background:var(--primary);color:#fff}
.bigtabs .cnt{font-size:11.5px;background:rgb(255 255 255 / .22);border-radius:999px;padding:0 7px;font-weight:800}
.bigtabs span:not(.on) .cnt{background:var(--secondary)}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--border)}
.mx thead th{position:sticky;top:0;background:var(--card);padding:12px 6px 10px;vertical-align:bottom;font-weight:700;font-size:12px;text-align:center;line-height:1.25}
.mx thead th.pc{text-align:start;padding-inline-start:20px;font-size:12.5px;color:var(--muted-foreground);font-weight:600}
.mx thead th .rn{display:block;color:var(--foreground);font-weight:800;font-size:12.5px;min-height:31px}
.mx thead th .uc{display:inline-flex;align-items:center;gap:3px;color:var(--muted-foreground);font-weight:600;font-size:11.5px;margin-top:4px}
.mx thead th.sa{background:color-mix(in srgb,var(--accent-soft) 60%,var(--card))}
.mx td{padding:7px 6px;text-align:center;vertical-align:middle;position:relative}
.mx td.pc{text-align:start;padding:8px 12px 8px 20px;padding-inline:20px 12px}
.mx td.pc .pl{font-weight:700;line-height:1.3}
.mx td.pc .pk{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted-foreground);direction:ltr;unicode-bidi:isolate}
.mx td.sa{background:color-mix(in srgb,var(--accent-soft) 35%,var(--card))}
.mx tr.modh td{background:var(--muted);text-align:start;padding:10px 20px;font-family:var(--font-display);font-weight:800;font-size:14px}
.mx tr.modh td .c{font-family:var(--font);font-weight:600;font-size:12px;color:var(--muted-foreground);margin-inline-start:8px}
.cell{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.cell .dotk{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--primary);color:#fff}
.cell .dotk.no{background:transparent;border:1.5px dashed var(--input);color:transparent}
.cell .dotk.lk{background:color-mix(in srgb,var(--accent) 55%,#fff);color:#6b4b00}
.cell .sc{font-size:10.5px;font-weight:700;color:var(--info-ink);line-height:1.1}

function permGroups(role,o={}){ /* o.phone, o.ro, o.chg:Set */
 return ["core","hr"].map(m=>{const ps=PERMS.filter(p=>p.m===m);const on=ps.filter(p=>role.g[p.k]).length;

   if(o.phone){return `<div class="mprow ${sc?"":"off"}"><div class="r1">${o.ro?`<span class="cbx lock">${ic("check")}</span>`:swc(!!sc)}<div><div class="pl">${v(p.l)}</div><div class="pdsc">${v(p.d)}</div></div></div>${sc&&SCOPED.has(p.k)&&!o.ro?`<div style="padding-inline-start:50px">${scopeSel(sc)}</div>`:""}</div>`;}

}

const MXCHG={"direct_manager|hr.lateness.view":"own_team","accountant|core.audit.view":"all"};
function mxCell(r,p){const key=r.k+"|"+p.k;const ch=MXCHG[key];const sc=ch||r.g[p.k];
 const act=key==="direct_manager|hr.lateness.view";
 let inner;
 if(r.sa) inner=`<span class="cell"><span class="dotk lk">${ic("lock-simple")}</span></span>`;
 else if(!sc) inner=`<span class="cell"><span class="dotk no">${ic("check")}</span></span>`;
 else inner=`<span class="cell"><span class="dotk">${ic("check")}</span>${sc!=="all"?`<span class="sc">${v(SCS[sc])}</span>`:""}</span>`;
 const pop=act?`<div class="pop"><div class="ph1">${v(p.l)} · ${v(r.n)}</div>${["all","own_stage","own_team","self"].map(x=>`<a href="#" class="${x==="own_team"?"on":""}">${ic(SCIC[x])}${v(SC[x])}${x==="own_team"?ic("check","ck"):""}</a>`).join("")}<div class="sepline"></div><a href="#" style="color:var(--destructive-ink)">${ic("x-circle")}${s("Remove permission","إزالة الصلاحية")}</a></div>`:"";
 return `<td class="${r.sa?"sa":""} ${ch?"chgd":""} ${act?"act":""}">${inner}${pop}</td>`;}
function C_matrix(){
 const head=`<thead><tr><th class="pc">${s("Permission","الصلاحية")}</th>${ROLES.map(r=>`<th class="${r.sa?"sa":""}"><span class="rn">${v(r.n)}</span>${r.sa?`<span class="bi" style="margin-top:4px">${ic("lock-simple")}${s("Fixed","ثابت")}</span>`:r.b?"":`<span class="bi cu" style="margin-top:4px">${s("Custom","مخصص")}</span>`}<br><span class="uc">${ic("user")}${num(r.u)}</span></th>`).join("")}</tr></thead>`;
 const body=["core","hr"].map(m=>`<tr class="modh"><td colspan="${ROLES.length+1}">${v(MODS[m])}<span class="c">${permsN(PERMS.filter(p=>p.m===m).length)}</span></td></tr>`+PERMS.filter(p=>p.m===m).map(p=>`<tr><td class="pc"><div class="pl">${v(p.l)}</div><div class="pk">${p.k}</div></td>${ROLES.map(r=>mxCell(r,p)).join("")}</tr>`).join("")).join("");
 return `<main class="main">${cHead("r")}
 <section class="toolbar"><div class="frow" style="align-items:center"><div class="segm" style="flex:none"><span class="on">${ic("grid-four")} ${s("Matrix","المصفوفة")}</span><span>${ic("list")} ${s("List","القائمة")}</span></div><label class="search" style="flex:1">${ic("magnifying-glass")}<span>${s("Find a permission","ابحث عن صلاحية")}</span></label>
 <div class="legend"><span><span class="cell"><span class="dotk">${ic("check")}</span></span>${v(SC.all)}</span><span><span class="cell"><span class="dotk">${ic("check")}</span></span><b style="color:var(--info-ink)">${v(SCS.own_stage)}</b> / <b style="color:var(--info-ink)">${v(SCS.own_team)}</b> ${s("= limited","= محدودة")}</span><span><span class="cell"><span class="dotk no">${ic("check")}</span></span>${s("Off","غير مفعّلة")}</span></div></div></section>
 <section class="card" style="overflow:visible"><table class="mx">${head}<tbody>${body}</tbody></table></section>
 ${saveBar(2,s("Save changes","حفظ التغييرات"))}</main>`;}

function C_forced(){return `<div class="auth" style="flex:1"><div class="art"><div class="brand" style="color:#fff"><div class="logo" style="background:#fff;color:var(--primary)">${ic("graduation-cap")}</div><div><div class="brand-name">${s("Green Valley School","مدرسة الوادي الأخضر")}</div><div class="brand-sub" style="color:rgb(255 255 255 / .75)">${s("School ERP","نظام إدارة المدرسة")}</div></div></div><div class="q">${s("One last step, then you're in.","خطوة أخيرة ثم تبدأ.")}</div><div style="position:relative;z-index:1;opacity:.85;font-size:13px">${s("Your password is yours alone. Nobody at the school, including the System admin, can see it.","كلمة مرورك لك وحدك. لا يستطيع أحد في المدرسة رؤيتها، ولا حتى مدير النظام.")}</div></div><div class="pane"><div style="display:flex;flex-direction:column;gap:16px;align-items:flex-end">${langT()}${forcedCard()}</div></div></div>`;}

 <section class="card"><div class="mcards">${USERS.map(u=>`<article class="mcard ${u.off?"inact":""}"><div class="top">${whoU(u.k,"sm",`<span class="num" dir="ltr">${u.e}</span>`)}<button class="ibtn">${ic("dots-three")}</button></div><div class="meta">${chips(u)}</div><div class="meta">${status(u)}${u.temp?tempPill():""}<span class="sp"></span><span>${v(u.last)}</span></div></article>`).join("")}</div>${mpager()}</section></main>`;}

function C_pSkel(){const r=()=>`<div class="skrow"><div class="l1">${skel("28px",28,10)}<div style="flex:1;display:flex;flex-direction:column;gap:6px">${skel("50%")}${skel("75%",10)}</div></div><div class="l1">${skel("70px",20,999)}${skel("90px",20,999)}</div><div class="l1">${skel("56px",20,999)}<span style="flex:1"></span>${skel("70px",10)}</div></div>`;

function C_pRoles(){return `<main class="main">${head(cTitle(),"",addBtn(s("Add custom role","إضافة دور مخصص")))}${cTabs("r")}<div class="note info">${ic("grid-four")}<span>${s("The permission matrix needs a wider screen. On a phone, open one role at a time.","مصفوفة الصلاحيات تحتاج شاشة أعرض. على الهاتف افتح دورًا واحدًا في كل مرة.")}</span></div>
 <section class="card"><div class="mcards">${ROLES.map(r=>`<article class="mcard"><div class="top"><span class="dotc" style="width:10px;height:10px;border-radius:50%;flex:none;background:${r.sa?"var(--accent)":r.b?"var(--primary)":"var(--info)"}"></span><div style="flex:1;min-width:0"><div style="font-weight:700">${v(r.n)}</div><div class="meta">${r.b?builtIn():customB()}<span>${r.sa?s("Every permission","كل الصلاحيات"):permsN(pc(r))}</span><span>·</span><span>${r.u?usersN(r.u):s("Nobody yet","لا أحد بعد")}</span></div></div>${ic("caret-right","flip")}</div></article>`).join("")}</div></section></main>`;}
function C_pRole(){const r=RO.front_desk;return `<main class="main" style="padding-bottom:0">${crumb(s("Roles","الأدوار"),v(r.n))}${head(`${v(r.n)} ${customB()}`)}<section class="card fcard"><h2>${s("Who holds this role","من يحمل هذا الدور")}</h2>${holderList("front_desk")}</section><section class="card fcard">${roleNames(r)}</section><section class="card" style="overflow:hidden">${permGroups(r,{phone:1})}</section><button class="btn btn-danger">${ic("trash")}${s("Delete role","حذف الدور")}</button>${saveBar(0)}</main>`;}
function C_pSA(){const r=RO.system_admin;return `<main class="main">${crumb(s("Roles","الأدوار"),v(r.n))}${head(`${v(r.n)} ${builtIn()}`)}${saBody()}<section class="card fcard"><h2>${s("Who holds this role","من يحمل هذا الدور")}</h2>${holderList("system_admin")}</section><section class="card" style="overflow:hidden">${permGroups(r,{phone:1,ro:1})}</section></main>`;}
function C_pMe(){return `<main class="main"><div class="acct-head">${av("hany")}<div style="min-width:0"><h2>${v(UU.hany.n)}</h2><div class="muted sm num ell" dir="ltr" style="text-align:start">${UU.hany.e}</div></div></div><div class="tabs"><span class="tab">${s("Profile","الملف الشخصي")}</span><span class="tab on">${s("Password","كلمة المرور")}</span></div><section class="card fcard">${pwForm("empty")}<button class="btn btn-primary btn-block" disabled>${s("Change password","تغيير كلمة المرور")}</button></section></main><!--over-->${toast("ok",s("Password changed","تم تغيير كلمة المرور"),s("Your other devices were signed out.","تم تسجيل خروجك من أجهزتك الأخرى."))}`;}
function C_pForced(){return `<!--nobar--><div style="background:var(--primary);color:#fff;padding:22px 18px 26px;position:relative;overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between"><div class="brand"><div class="logo" style="background:#fff;color:var(--primary)">${ic("graduation-cap")}</div><div class="brand-name">${s("Green Valley School","مدرسة الوادي الأخضر")}</div></div>${langT()}</div><div style="font-family:var(--font-display);font-weight:800;font-size:22px;margin-top:18px;position:relative;z-index:1">${s("One last step, then you're in.","خطوة أخيرة ثم تبدأ.")}</div><span style="position:absolute;width:140px;height:140px;border-radius:50%;background:var(--accent);inset-inline-end:-40px;bottom:-60px"></span></div><div style="padding:8px 0">${forcedCard(1)}</div>`;}

function render(){
 document.documentElement.lang=lang; document.documentElement.dir=AR()?"rtl":"ltr";
 document.getElementById("optNote").innerHTML=NOTE[opt][lang];
 document.getElementById("deskSec").innerHTML=DESK[opt].map(([en,ar,page,fn])=>`<div class="section-title">${s("Desktop · 1440 px — ","سطح المكتب · 1440 بكسل — ")}${s(en,ar)}</div><div class="desk-scroll"><div class="desk">${page?side(page):""}${fn()}</div></div>`).join("");
 document.getElementById("phoneT").textContent=s("Phone · 390 px","الهاتف · 390 بكسل");
 document.getElementById("phones").innerHTML=PHONES[opt].map(([en,ar,fn,fixed])=>{let html=fn();const nobar=html.startsWith("<!--nobar-->");
  const i=html.indexOf("<!--over-->");const mainPart=i<0?html:html.slice(0,i), over=i<0?"":html.slice(i);
  return `<div class="phone-wrap"><div class="phone ${fixed?"fixed":""}">${nobar?"":mbar()}<div class="scroll">${mainPart}</div>${over}</div><div class="phone-cap">${s(en,ar)}</div></div>`;}).join("");
}
const q=new URLSearchParams(location.search);
if(q.get("opt")) opt=q.get("opt"); if(q.get("lang")) lang=q.get("lang");
if(q.get("view")==="desktop") document.body.classList.add("only-desktop");
if(q.get("view")==="phone") document.body.classList.add("only-phone");
if(q.get("full")) document.body.classList.add("full");
const sync=()=>{document.querySelectorAll("#optSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.opt===opt));document.querySelectorAll("#langSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));};
document.querySelectorAll("#optSeg button").forEach(b=>b.addEventListener("click",()=>{opt=b.dataset.opt;sync();render();}));
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;sync();render();}));
sync();render();
</script>
