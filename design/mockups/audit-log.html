<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
/* Tokens copied from apps/web/src/app/globals.css (direction "Campus"). Light theme only. */
:root{
  --radius:14px;
  --background:#f2f8f6; --foreground:#11302b; --card:#ffffff;
  --muted:#f5faf8; --muted-foreground:#587069; --secondary:#eaf4f1;
  --primary:#0b7a68; --primary-foreground:#ffffff; --primary-soft:#d5efe8; --primary-hover:#096656;
  --accent:#ffc43d; --accent-foreground:#4a3400; --accent-soft:#fff1c9;
  --success:#1f9a62; --success-soft:#ddf4e7; --success-ink:#126b42;
  --warning:#d9771c; --warning-soft:#ffe8d2; --warning-ink:#8f4608;
  --destructive:#d9473a; --destructive-soft:#fde3df; --destructive-ink:#a82d22;
  --info:#2f6fb3; --info-soft:#e0eefb; --info-ink:#24578e;
  --border:#dce9e5; --input:#cfe0db;
  --overlay:rgb(9 40 35 / .42);
  --shadow-card:0 1px 2px rgb(11 72 62 / .06),0 10px 30px -12px rgb(11 72 62 / .18);
  --shadow-raised:0 2px 4px rgb(11 72 62 / .05),0 30px 60px -24px rgb(11 72 62 / .28);
  --shadow-primary:0 8px 20px -8px rgb(11 122 104 / .7);
  --ease-snappy:cubic-bezier(.22,1,.36,1);
  --bar:#0f2f2a; --bar-ink:#e7f4f0;
  --font-latin:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --font-ar-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font:var(--font-latin); --font-display:var(--font-latin);
  color-scheme:light;
}
:root[lang="ar"]{--font:var(--font-ar);--font-display:var(--font-ar-display)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e4efec;color:var(--foreground);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
.num{font-family:var(--font-latin);font-variant-numeric:tabular-nums lining-nums}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ph-duotone.flip,.ph-duotone.car{display:inline-block}
.ph-duotone{line-height:1}
bdi{unicode-bidi:isolate}

/* ---------- mockup bar ---------- */
.mockbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:16px;padding:10px 24px;position:sticky;top:0;z-index:50;flex-wrap:wrap;font-size:13px}
.mockbar strong{font-size:14px}
.mockbar .hint{opacity:.7}
.mockbar .sp{flex:1}
.seg{display:inline-flex;background:rgb(255 255 255 / .08);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#3a2900}
.seg .ar{font-family:var(--font-ar-display);font-size:15px}
.optnote{padding:18px 24px 0;max-width:1488px;margin-inline:auto;color:var(--muted-foreground);font-size:13.5px}
.optnote b{color:var(--foreground)}
.section-title{max-width:1488px;margin:28px auto 10px;padding-inline:24px;font-family:var(--font-display);font-weight:800;font-size:16px}
body.only-desktop #phoneSec, body.only-phone #deskSec{display:none}

/* ---------- frames ---------- */
.desk-scroll{overflow-x:auto;padding:6px 24px 8px}
.desk{width:1440px;margin-inline:auto;position:relative;background:var(--background);border-radius:22px;box-shadow:var(--shadow-raised);overflow:hidden;border:1px solid var(--border);display:flex;min-height:1000px;container:page / inline-size}
.phones{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;padding:6px 24px 60px;align-items:flex-start}
.phone-wrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.phone-cap{font-size:12.5px;color:var(--muted-foreground);font-weight:600}
.phone{width:390px;height:844px;background:var(--background);border-radius:44px;border:10px solid #1b2e2a;box-shadow:var(--shadow-raised);overflow:hidden;position:relative;container:page / inline-size;display:flex;flex-direction:column}
.phone .scroll{overflow-y:auto;flex:1;scrollbar-width:none}
body.full .phone:not(.fixed){height:auto;min-height:844px}
body.full .phone:not(.fixed) .scroll{overflow:visible}

/* ---------- sidebar (app shell, option B module groups) ---------- */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:22px;position:relative}
.logo::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);inset-block-start:-2px;inset-inline-end:-2px;box-shadow:0 0 0 2px var(--card)}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:14.5px;line-height:1.25}
.brand-sub{font-size:11.5px;color:var(--muted-foreground)}
.soon{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--secondary);color:var(--muted-foreground);margin-inline-start:auto;white-space:nowrap}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--muted);border:1px solid var(--border)}
.user .av{width:36px;height:36px;border-radius:12px;font-size:13px}
.user .n{font-weight:700;font-size:13px;line-height:1.2}
.user .r{font-size:11.5px;color:var(--muted-foreground)}
.user > .ph-duotone{margin-inline-start:auto;color:var(--muted-foreground);font-size:18px}
.navlink{display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 12px;border-radius:12px;color:var(--muted-foreground);text-decoration:none;font-weight:600;font-size:14px}
.navlink .ph-duotone{font-size:20px}
.navlink[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.navlink[aria-current="page"]::after{content:"";margin-inline-start:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.sb{width:272px;flex:none;background:var(--card);border-inline-end:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.sb nav{display:flex;flex-direction:column;gap:6px}
.mod{border-radius:16px}
.mod[open]{background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.mod summary{list-style:none;display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--foreground)}
.mod summary::-webkit-details-marker{display:none}
.mi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.mod summary .car{margin-inline-start:auto;color:var(--muted-foreground);font-size:16px}
.mod[open] summary .car{transform:rotate(180deg)}
.mod .kids{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px;margin-inline-start:24px;border-inline-start:2px solid var(--border);padding-inline-start:8px}
.mod .kids .navlink{min-height:36px;font-size:13.5px;padding:6px 10px}
.mod.dis summary{cursor:not-allowed;color:var(--muted-foreground);font-weight:600}
.mod.dis summary .mi{filter:grayscale(1);opacity:.7}
.sb .single{display:flex;align-items:center;gap:11px;min-height:46px;padding:8px 10px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--foreground);text-decoration:none}
.sb .single .mi{background:var(--secondary);color:var(--muted-foreground)}
.sb .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.newdot{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:#6b4b00;margin-inline-start:auto}

/* ---------- main + common controls ---------- */
.main{flex:1;min-width:0;padding:22px 36px 36px;display:flex;flex-direction:column;gap:18px;position:relative}
.topline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-foreground);min-height:40px}
.topline .sp{flex:1}
.lang{display:inline-flex;background:var(--secondary);border-radius:999px;padding:3px}
.lang span{padding:4px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.lang span.on{background:var(--accent);color:var(--accent-foreground)}
.lang .ar{font-family:var(--font-ar-display);font-size:14px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
:root[lang="ar"] .head h1{letter-spacing:0}
.head p{margin:4px 0 0;color:var(--muted-foreground);font-size:14px;max-width:640px}
.head .acts{margin-inline-start:auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--input);background:var(--card);white-space:nowrap}
.btn .ph-duotone{font-size:18px}
.btn-primary{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow-primary)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--primary)}
.toolbar{background:var(--card);border-radius:20px;box-shadow:var(--shadow-card);padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:2.2;min-width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;height:42px;background:var(--card);color:var(--muted-foreground)}
.search .ph-duotone{font-size:18px;flex:none}
.search span{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsel{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--input);border-radius:var(--radius);padding:0 12px;background:var(--card);font-size:13.5px;font-weight:600;color:var(--foreground);white-space:nowrap;position:relative}
.fsel .ph-duotone{color:var(--muted-foreground);font-size:16px}
.fsel .ph-caret-down{margin-inline-start:auto}
.fsel.set{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.fsel.set .ph-duotone{color:var(--primary)}
.resline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground);padding:0 4px;flex-wrap:wrap}
.resline b{color:var(--foreground)}
.resline .sp{flex:1}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 8px 3px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:13px;padding:0;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-card)}
.av{border-radius:12px;background:var(--accent);color:var(--accent-foreground);display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--font-display);width:34px;height:34px;font-size:12.5px}
.av.anon{background:var(--secondary);color:var(--muted-foreground)}
.av.sm{width:28px;height:28px;border-radius:10px;font-size:11px}
.av.lg{width:42px;height:42px;border-radius:14px;font-size:14px}
.ibtn{width:34px;height:34px;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.ibtn .ph-duotone{font-size:18px}
.ibtn.on{background:var(--primary-soft);color:var(--primary)}
.ibtn.bd{border-color:var(--border);background:var(--card)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .n{font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .r{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ph-duotone{font-size:14px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.m-core{background:var(--secondary);color:var(--muted-foreground)}
.m-hr{background:var(--primary-soft);color:var(--primary)}
.t-money{background:var(--info-soft);color:var(--info-ink)}
.t-fail{background:var(--warning-soft);color:var(--warning-ink)}
.p-active{background:var(--success-soft);color:var(--success-ink)}
.kic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--secondary);color:var(--muted-foreground)}
.kic.money{background:var(--info-soft);color:var(--info)}
.kic.fail{background:var(--warning-soft);color:var(--warning)}
.kic.ok{background:var(--success-soft);color:var(--success)}
.sent{line-height:1.45}
.sent .rec{font-weight:700}
.chg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;vertical-align:baseline}
.old{color:var(--muted-foreground);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted-foreground) 60%,transparent)}
.new{font-weight:700}
.arr{font-size:13px;color:var(--muted-foreground)}
.money{font-weight:700;white-space:nowrap}
.money .cur{font-weight:600;color:var(--muted-foreground);font-size:.82em}
.new .money,.money.new{color:var(--info-ink)}
.time{white-space:nowrap;color:var(--foreground);font-weight:600;font-size:13px;border-bottom:1px dashed var(--input);cursor:help;position:relative}
.time-sub{font-size:12px;color:var(--muted-foreground)}
.tip{position:absolute;inset-block-start:calc(100% + 8px);inset-inline-start:-6px;background:var(--foreground);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:5;box-shadow:var(--shadow-raised)}
.tip::before{content:"";position:absolute;top:-4px;inset-inline-start:16px;width:8px;height:8px;background:inherit;transform:rotate(45deg)}

/* changes table (shared) */
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{font-size:12px;color:var(--muted-foreground);font-weight:600;text-align:start;padding:6px 12px;border-bottom:1px solid var(--border)}
.ctab td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.ctab tr:last-child td{border-bottom:0}
.ctab td.f{color:var(--muted-foreground);font-weight:600;width:30%}
.ctab td.b{color:var(--muted-foreground)}
.ctab td.a{font-weight:700}
.ctab .none{color:var(--muted-foreground);font-weight:500}
.ctab .arcell{width:24px;color:var(--muted-foreground);padding-inline:0;text-align:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{background:var(--muted);border-radius:12px;padding:8px 12px;min-width:0}
.fact .l{font-size:11.5px;color:var(--muted-foreground)}
.fact .v{font-size:13px;font-weight:700;overflow-wrap:anywhere}

/* row menu */
.menu{position:absolute;z-index:6;background:var(--card);border-radius:14px;box-shadow:var(--shadow-raised);border:1px solid var(--border);padding:6px;min-width:230px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--foreground);text-decoration:none;white-space:nowrap}
.menu a .ph-duotone{font-size:18px;color:var(--muted-foreground)}
.menu a.hl{background:var(--muted)}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;border-top:1px solid var(--border)}
.pager .info{font-size:13px;color:var(--muted-foreground)}
.pages{display:flex;gap:6px;align-items:center}
.pg{min-width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 8px}
.pg[aria-current="page"]{background:var(--primary);color:#fff;border-color:transparent}
.pg[disabled]{opacity:.45;cursor:default}
.pg .ph-duotone{font-size:16px}
.gap{color:var(--muted-foreground)}
.mpager{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.mpager .info{font-size:12.5px;color:var(--muted-foreground)}
.mpager .row{display:flex;align-items:center;justify-content:space-between}
.mpager .row b{font-size:13px}

/* tabs (profile) */
.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted-foreground)}
.crumb .ph-duotone{font-size:12px}
.submeta{font-size:14px;color:var(--muted-foreground);margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 16px;font-weight:600;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:14px}
.tab.on{color:var(--primary);border-color:var(--primary);font-weight:700}
.tab .cnt{font-size:11px;font-weight:800;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:0 7px}
.sec-h{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:800}
.sec-h p{margin:2px 0 0;font-size:13px;color:var(--muted-foreground)}
.sec-h .sp{flex:1}

/* ================= OPTION A: dense table ================= */
.ta{width:calc(100% - 20px);margin:10px;border-collapse:separate;border-spacing:0}
.ta>thead th{background:var(--muted);font-size:12.5px;color:var(--muted-foreground);font-weight:600;text-align:start;padding:11px 14px;white-space:nowrap}
.ta>thead th:first-child{border-start-start-radius:12px;border-end-start-radius:12px}
.ta>thead th:last-child{border-start-end-radius:12px;border-end-end-radius:12px}
.ta>tbody>tr>td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;position:relative}
.ta>tbody>tr.fail>td:first-child::before{content:"";position:absolute;inset-inline-start:-10px;top:0;bottom:0;width:4px;background:var(--warning)}
.ta tr.open > td{background:color-mix(in srgb,var(--primary-soft) 45%,transparent);border-bottom-color:transparent}
.ta>tbody>tr.exp>td{padding:0 14px 16px;background:color-mix(in srgb,var(--primary-soft) 45%,transparent)}
.ta .exbox{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:12px 14px;display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.ta .exbox h4,.xh{margin:0 0 6px;font-size:12px;color:var(--muted-foreground);font-weight:700}
.ta .exbox .meta{display:flex;flex-direction:column;gap:8px}
.ta .act{display:flex;align-items:center;gap:10px}
.ta .act .tags{display:flex;gap:6px;flex:none}
.ta .car{color:var(--muted-foreground);font-size:16px}
.ta tr.open .car{transform:rotate(90deg);color:var(--primary)}
[dir="rtl"] .ta tr.open .car{transform:rotate(-90deg) scaleX(-1)}
.ta .hgroup>td{border-bottom-color:transparent;padding-bottom:4px}
.ta .hfirst>td{padding-top:14px}
/* A cards for phone */
.acards{display:flex;flex-direction:column}
.acard{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px;position:relative}
.acard.fail::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:4px;border-start-end-radius:4px;border-end-end-radius:4px;background:var(--warning)}
.acard .top{display:flex;align-items:center;gap:10px}
.acard .top .who{flex:1}
.acard .bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acard .bot .sp{flex:1}
.acard.open{background:color-mix(in srgb,var(--primary-soft) 40%,transparent)}
.mchg{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px 12px}
.mchg .r{padding:8px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;font-size:13px}
.mchg .r:last-child{border-bottom:0}
.mchg .r .l{font-size:11.5px;color:var(--muted-foreground);font-weight:600}
.mchg .meta{font-size:12px;color:var(--muted-foreground);padding:8px 0}

/* picker sheet */
.scrim{position:absolute;inset:0;background:var(--overlay);z-index:5}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-raised);display:flex;flex-direction:column;max-height:88%}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--input);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--border)}
.sheet .sh h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:800;flex:1;min-width:0}
.sheet .sbody{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.plist{display:flex;flex-direction:column;gap:2px}
.popt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
.popt.sel{background:var(--primary-soft)}
.popt .who{flex:1}
.popt .ck{color:var(--primary);font-size:18px}
.popt .ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--secondary);color:var(--muted-foreground);font-size:16px;flex:none}
.pinput{display:flex;align-items:center;gap:8px;border:1px solid var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);border-radius:var(--radius);padding:0 12px;height:42px;color:var(--muted-foreground);font-size:13.5px}

/* skeleton */
.sk{background:var(--secondary);border-radius:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.skrow{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.skrow .l1{display:flex;gap:10px;align-items:center}

/* ================= OPTION B: timeline ================= */
.bwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.tl{padding:6px 0 0}
.dayh{display:flex;align-items:center;gap:10px;padding:16px 24px 8px;font-weight:800;font-family:var(--font-display);font-size:15px}
.dayh .c{font-family:var(--font);font-weight:600;font-size:12.5px;color:var(--muted-foreground)}
.dayh::after{content:"";flex:1;height:1px;background:var(--border)}
.dayh .c{order:2}
.dayh::after{order:1}
.ti{display:grid;grid-template-columns:86px 36px minmax(0,1fr);gap:0 12px;padding:0 24px;position:relative}
.ti .tm{padding-top:8px;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.ti .rail{position:relative;display:flex;justify-content:center}
.ti .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--border)}
.ti:first-of-type .rail::before{top:14px}
.ti.last .rail::before{bottom:auto;height:14px}
.ti .rail .kic{position:relative;margin-top:4px;box-shadow:0 0 0 4px var(--card)}
.ti .body{padding:6px 0 18px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ti .line1{font-size:14px}
.ti .line1 .actor{font-weight:800}
.ti .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ti .diffs{display:flex;flex-direction:column;gap:4px;background:var(--muted);border-radius:12px;padding:8px 12px;font-size:13px}
.ti .diffs .d{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ti .diffs .d .l{color:var(--muted-foreground);font-weight:600;min-width:110px}
.ti.fail .body .line1{color:var(--warning-ink)}
.ti.sel .body{}
.bfilt{padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0}
.bfilt h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}

.segm span.on{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgb(11 72 62 / .12)}
.cbs{display:flex;flex-wrap:wrap;gap:6px}
.cb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--input);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.cb.on{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.cb .ph-duotone{font-size:14px}
.pbox{border:1px solid var(--input);border-radius:14px;overflow:hidden}
.pbox .pinput{border:0;box-shadow:none;border-bottom:1px solid var(--border);border-radius:0}
.pbox .plist{padding:4px;max-height:226px;overflow:hidden}
.pbox .popt{padding:6px 8px}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.glance .g{background:var(--muted);border-radius:12px;padding:10px 12px}
.glance .g .v{font-size:20px;font-weight:800}
.glance .g .l{font-size:12px;color:var(--muted-foreground)}
.glance .g.w .v{color:var(--warning-ink)}
.glance .g.i .v{color:var(--info-ink)}
.bphone-bar{display:flex;gap:8px}
.bphone-bar .search{min-width:0;flex:1}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13.5px;white-space:nowrap}
.fbtn .n{background:var(--primary);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.monthh{padding:16px 24px 6px;font-size:12.5px;font-weight:800;color:var(--muted-foreground);letter-spacing:.02em}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 24px}

.empty h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:800}
.empty p{margin:0;color:var(--muted-foreground);font-size:13.5px}

.clist{display:flex;flex-direction:column;overflow:hidden}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:13px 16px;border-bottom:1px solid var(--border);position:relative}

.crow.sel{background:var(--primary-soft)}

.hitem .mini .d{display:flex;gap:8px;flex-wrap:wrap}
.hitem .mini .d .l{color:var(--muted-foreground);font-weight:600}

/* ---------- phone chrome ---------- */
.mbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);flex:none}
.mbar .menub{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;font-size:20px}
.mbar .brand-name{font-size:14px}
.mbar .lang{margin-inline-start:auto}

/* ---------- container: phone width ---------- */
@container page (max-width:720px){
  .main{padding:16px;gap:14px}
  .topline{display:none}
  .head h1{font-size:24px}
  .head p{font-size:13px}
  .head .acts{width:100%}
  .head .acts .btn{flex:1}
  .toolbar{padding:12px;border-radius:18px}
  .search{min-width:100%}
  .fsel{min-width:calc(50% - 5px);flex:1 1 calc(50% - 5px)}
  .card{border-radius:20px}
  .sec-h{padding:16px 14px 10px}
  .sec-h h2{font-size:17px}
  .ti{grid-template-columns:32px minmax(0,1fr);padding:0 14px;gap:0 10px}
  .ti .tm{display:none}
  .ti .rail .kic{width:30px;height:30px;font-size:16px}
  .ti .body .ptime{font-size:12px;color:var(--muted-foreground)}
  .ti .diffs .d .l{min-width:0;width:100%}
  .dayh{padding:14px 14px 6px;font-size:14px}
  .monthh{padding:14px 14px 4px}
  .crow{padding:12px 14px}
  .pdg{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr}
  .tabs .tab{padding:10px 12px;font-size:13.5px}
}

function C_phoneHist(){const t=L();
 return `<main class="main">${profileHead(`<button class="btn">${ic("clock-counter-clockwise")}${t.histBtn}</button>`)}${tabs(false,true)}<section class="card pd"><h3>${t.payc}</h3></section></main>
 <div class="scrim"></div><div class="sheet" style="max-height:90%"><div class="grab"></div><div class="hpanel" style="overflow:auto;scrollbar-width:none">${C_hpanel(true)}</div></div>`;}

/* ---------- render ---------- */
function render(){
 const t=L();
 document.documentElement.lang=lang; document.documentElement.dir=AR()?"rtl":"ltr";
 document.getElementById("optNote").innerHTML=NOTE[opt][lang];
 document.getElementById("deskT1").textContent=t.deskT1;
 document.getElementById("deskT2").textContent=t.deskT2;
 document.getElementById("phoneT").textContent=t.phoneT;
 const F={A:[A_activity,A_history],B:[B_activity,B_history],C:[C_activity,C_history]}[opt];
 document.getElementById("desk1").innerHTML=side("activity")+F[0]();
 document.getElementById("desk2").innerHTML=side("employee")+F[1]();
 const phones={
  A:[[t.capList,A_phoneList],[t.capHist,A_phoneHist],[t.capPicker,A_picker,1],[t.capSkel,A_skeleton,1]],
  B:[[t.capList,B_phoneList],[t.capHist,B_phoneHist],[t.capEmpty,B_empty,1]],
  C:[[t.capList,C_phoneList],[t.capSheet,C_sheet,1],[t.capHSheet,C_phoneHist,1]]}[opt];
 document.getElementById("phones").innerHTML=phones.map(([cap,fn,fixed])=>{const html=fn();
  const i=html.indexOf('<div class="scrim">');const mainPart=i<0?html:html.slice(0,i), over=i<0?"":html.slice(i);
  return `<div class="phone-wrap"><div class="phone ${fixed?"fixed":""}">${mbar()}<div class="scroll">${mainPart}</div>${over}</div><div class="phone-cap">${cap}</div></div>`;}).join("");
}
const q=new URLSearchParams(location.search);
if(q.get("opt")) opt=q.get("opt"); if(q.get("lang")) lang=q.get("lang");
if(q.get("view")==="desktop") document.body.classList.add("only-desktop");
if(q.get("view")==="phone") document.body.classList.add("only-phone");
if(q.get("full")) document.body.classList.add("full");
const sync=()=>{document.querySelectorAll("#optSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.opt===opt));document.querySelectorAll("#langSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));};
document.querySelectorAll("#optSeg button").forEach(b=>b.addEventListener("click",()=>{opt=b.dataset.opt;sync();render();}));
document.querySelectorAll("#langSeg button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;sync();render();}));
sync();render();
</script>
