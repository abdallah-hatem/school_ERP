name: CI

on:
  pull_request:
    branches: [dev, testing, production, demo]
  # dev doesn't require PR branches to be up to date (owner, 2026-11-18), so the full suite runs
  # once more on dev itself after every merge: two PRs that pass alone but break together show here.
  push:
    branches: [dev]

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Postgres service container (throwaway; nothing here is used outside CI).
  E2E_PG_URL: postgresql://postgres:postgres@localhost:5432

jobs:
  # Docs-only PRs (every changed file under docs/, design/mockups/ or a *.md) skip API e2e and smoke:
  # those jobs still run and report success, because branch protection requires them by name and a
  # job skipped with a job-level `if` would never report a matrix job's real name.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # On a push to dev (after a merge) always run everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|design/mockups/)|\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    # Branch protection requires this job by name — don't rename it.
    name: Lint, typecheck, unit tests, module rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same script developers run locally (and the pre-push hook runs), so the two can't drift.
      - name: Lint, typecheck, unit tests, module rules
        run: pnpm ci:local

      - name: Module dependency graph
        if: always()
        run: pnpm deps:graph

      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-dependency-graph
          path: deps-graph.dot
          if-no-files-found: ignore

  e2e:
    name: API e2e
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Docs only — nothing to test
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only docs changed; skipped."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Turbo cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-

      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Create and migrate school_erp_e2e_ci
        if: needs.changes.outputs.docs_only != 'true'
        run: scripts/e2e-db.sh ci

      # setup-env.ts supplies the throwaway JWT secret and seed password; PORT 0 picks a free port.
      - name: API e2e
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ env.E2E_PG_URL }}/school_erp_e2e_ci?schema=public

  smoke:
    # Sharded by Playwright project: each shard has its own runner, database and servers.
    name: Smoke (${{ matrix.project }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-en, phone-ar]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Docs only — nothing to test
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Only docs changed; skipped."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Next.js build cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        if: needs.changes.outputs.docs_only != 'true'
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        if: needs.changes.outputs.docs_only != 'true'
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: needs.changes.outputs.docs_only != 'true' && (steps.pw-cache.outputs.cache-hit != 'true')
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: needs.changes.outputs.docs_only != 'true' && (steps.pw-cache.outputs.cache-hit == 'true')
        run: pnpm --filter web exec playwright install-deps chromium

      # Generic seed only: CI has no prisma/seed-data.local/ (git-ignored client data), so nothing in
      # the screenshots or report is client material. smoke.sh generates the admin password per run.
      - name: Smoke specs
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/smoke.sh --project=${{ matrix.project }}
        env:
          SMOKE_DB: ci_${{ matrix.project == 'desktop-en' && 'desktop' || 'phone' }}

      - name: Upload Playwright report, screenshots and logs
        if: needs.changes.outputs.docs_only != 'true' && (failure())
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.project }}
          path: |
            apps/web/e2e/.report/
            apps/web/e2e/.results/
            apps/web/e2e/screenshots/
            apps/web/e2e/.logs/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
